name: Deploy Wedding App to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate secrets and inject KV id into wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_LIVE_ID: ${{ secrets.CLOUDFLARE_KV_LIVE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_KV_LIVE_ID:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_KV_LIVE_ID"
            exit 1
          fi
          sed -i "s/REPLACE_ME_KV_NAMESPACE_ID/${CLOUDFLARE_KV_LIVE_ID}/g" wrangler.toml

      - name: Deploy to Cloudflare Pages (Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.90.1 pages deploy . --project-name=wanda-mattia-ap --commit-dirty=true
