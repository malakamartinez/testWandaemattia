# Deploy con Wrangler (richiede token con permesso "Cloudflare Pages - Edit").
# Se fallisce con code 10000 / 9106 → vedi docs/CLOUDFLARE_API_TOKEN.md
# In alternativa usa solo pages-git-only.yml + Connect to Git in Dashboard.

name: Deploy via Wrangler (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Manca CLOUDFLARE_API_TOKEN — vedi docs/CLOUDFLARE_API_TOKEN.md"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Manca CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Test token (whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.90.1 whoami

      - name: Deploy Pages (root = public + functions + wrangler.toml)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.90.1 pages deploy . \
            --project-name=wanda-mattia-ap \
            --branch=main \
            --commit-dirty=true
